<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>은솔마린 | 조업현황·공지사항</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">은솔마린</a>
      <nav class="top-nav">
        <a href="/booking.html">실시간 예약</a>
        <a href="/boats.html">배 소개</a>
        <a href="/board.html" class="active">조업현황·공지</a>
      </nav>
    </header>

    <main class="simple-wrap">
      <h1>게시판</h1>
      <div class="tab-row">
        <button type="button" data-tab="catch" class="tab-btn active">조업현황</button>
        <button type="button" data-tab="notice" class="tab-btn">공지사항</button>
      </div>

      <section class="panel">
        <h2 id="boardTitle">조업현황 글쓰기</h2>
        <form id="postForm" class="booking-form">
          <label>작성자 <input id="author" required placeholder="관리자" /></label>
          <label>제목 <input id="title" required placeholder="제목을 입력하세요" /></label>
          <label>내용 <textarea id="content" rows="5" required placeholder="내용을 입력하세요"></textarea></label>
          <button type="submit">게시글 등록</button>
        </form>
        <p id="postMessage" class="message"></p>
      </section>

      <section class="panel">
        <h2 id="listTitle">조업현황 목록</h2>
        <div id="postList" class="post-list"></div>
      </section>
    </main>

    <footer class="footer"><p>© 은솔마린</p></footer>
    <script src="board.js" defer></script>
  </body>
</html>
